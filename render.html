<!doctype html>
<meta charset="utf-8">
<!-- 밥심 스캐너 (퇴식구 스테이션) — 기술 설계 정리(2026-11-25) 그대로의 3D 모델.
     ?mode=raster 빠른 미리보기 · ?mode=pt&spp=N 경로 추적. 단위 mm, y 위. -->
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js",
  "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.23/build/index.module.js"
} }
</script>
<script type="module">
import * as THREE from 'three'
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

const q = new URLSearchParams(location.search)
const MODE = q.get('mode') || 'raster', SPP = +(q.get('spp') || 256), VIEW = q.get('view') || 'hero'
const W = innerWidth, H = innerHeight
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: false, powerPreference: 'high-performance' })
renderer.setPixelRatio(devicePixelRatio)
renderer.setSize(W, H)
renderer.toneMapping = THREE.NeutralToneMapping
renderer.toneMappingExposure = +(q.get('exp') || 1)
renderer.shadowMap.enabled = MODE === 'raster'
renderer.shadowMap.type = THREE.VSMShadowMap
document.body.appendChild(renderer.domElement)

const scene = new THREE.Scene()
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
const R = (a, b) => a + (b - a) * rnd()

// ── materials
const P = (o) => new THREE.MeshPhysicalMaterial(o)
const M = {
  steel: P({ color: 0xcfd3d8, metalness: 1, roughness: 0.3 }),
  steelDark: P({ color: 0xb7bcc2, metalness: 1, roughness: 0.42 }),
  polished: P({ color: 0xe4e6e9, metalness: 1, roughness: 0.1 }),
  alu: P({ color: 0xc3c8ce, metalness: 1, roughness: 0.36 }),
  graphite: P({ color: 0x2a2d31, roughness: 0.46, clearcoat: 0.35, clearcoatRoughness: 0.35 }),
  graphite2: P({ color: 0x1c1e21, roughness: 0.6 }),
  plate: P({ color: 0xf3f3f0, roughness: 0.52, clearcoat: 0.15 }),
  tray: P({ color: 0xf8f8f5, roughness: 0.3, clearcoat: 0.5, clearcoatRoughness: 0.2 }),
  rubber: P({ color: 0x18191b, roughness: 0.92 }),
  glass: P({ color: 0x07090d, roughness: 0.04, clearcoat: 1, metalness: 0.1 }),
  polar: P({ color: 0x14203a, roughness: 0.03, clearcoat: 1, metalness: 0.3 }),
  ring: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 7 }),
  diffuse: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff6ea, emissiveIntensity: 2.4, roughness: 0.9 }),
  nir: P({ color: 0x3a0d0d, roughness: 0.2, clearcoat: 1 }),
  gauge: P({ color: 0xf1efe8, roughness: 0.85 }),
  hole: P({ color: 0x0c0c0d, roughness: 0.8 }),
  led: new THREE.MeshStandardMaterial({ color: 0x3ad16e, emissive: 0x3ad16e, emissiveIntensity: 4 }),
  wireR: P({ color: 0xb3261e, roughness: 0.5 }), wireK: P({ color: 0x1a1a1a, roughness: 0.5 }),
  wireG: P({ color: 0x2f7d3a, roughness: 0.5 }), wireW: P({ color: 0xe8e8e8, roughness: 0.5 }),
  cable: P({ color: 0x3b3e43, roughness: 0.55 }),
  rice: P({ color: 0xf1ece0, roughness: 0.55, sheen: 0.3 }),
  kimchi: P({ color: 0xc4432a, roughness: 0.28, clearcoat: 0.6 }),
  napa: P({ color: 0xe9d9b6, roughness: 0.35, clearcoat: 0.4 }),
  greens: P({ color: 0x3e6a2b, roughness: 0.38, clearcoat: 0.4 }),
  meat: P({ color: 0x7a3a1c, roughness: 0.3, clearcoat: 0.7 }),
  sauce: P({ color: 0xa8481f, roughness: 0.15, clearcoat: 1 }),
  soup: P({ color: 0xb04a22, roughness: 0.04, clearcoat: 1, ior: 1.33 }),
  tofu: P({ color: 0xf4f0e2, roughness: 0.5 }),
  onion: P({ color: 0x6ea040, roughness: 0.35 }),
  floor: P({ color: 0xffffff, roughness: 0.9 }),
}
const add = (g, m, x = 0, y = 0, z = 0, parent = scene) => { if (g.groups?.length) g.clearGroups(); const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; parent.add(o); return o }
const rbox = (w, h, d, r, seg = 4) => new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2 - 0.01, h / 2 - 0.01, d / 2 - 0.01))
const rrect = (s, x0, z0, x1, z1, r) => { // a rounded rectangle path in shape space (x, -z)
  const a = x0, b = -z1, c = x1, d = -z0
  s.moveTo(a + r, b); s.lineTo(c - r, b); s.quadraticCurveTo(c, b, c, b + r); s.lineTo(c, d - r); s.quadraticCurveTo(c, d, c - r, d)
  s.lineTo(a + r, d); s.quadraticCurveTo(a, d, a, d - r); s.lineTo(a, b + r); s.quadraticCurveTo(a, b, a + r, b); return s }
const tex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t }

// ── studio: a seamless white floor that bends up into a wall far behind
{
  const pts = []
  for (let i = 0; i <= 24; i++) { const a = (i / 24) * Math.PI / 2; pts.push([-1400 - Math.sin(a) * 900, 900 - Math.cos(a) * 900]) }
  const prof = [[4000, 0], ...pts, [-2300, 6000]]
  const pos = [], idx = []
  prof.forEach(([z, y], i) => { pos.push(-6000, y, z, 6000, y, z); if (i) { const k = i * 2; idx.push(k - 2, k - 1, k, k - 1, k + 1, k) } })
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals()
  const floor = add(g, M.floor); floor.castShadow = false
}

// ════════ KIOSK (이동형 스테이션): casters → legs → stainless deck with the scale → back panel → canopy with the camera
const anchors = {}
const TOP = 870, PB = 904, PT = 916, CAN = 1580   // deck top · plate bottom · plate top · canopy underside
const ONLY = q.get('only')   // only=tray: the tray and the bowl on a table, nothing of the station
if (!ONLY) {
// casters with a brake pedal, legs, stretchers
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const x = sx * 290, z = sz * 240
  add(rbox(40, 700, 40, 4), M.steel, x, 100 + 350, z)
  add(rbox(64, 6, 64, 2), M.steelDark, x, 97, z)
  add(new THREE.CylinderGeometry(9, 9, 14, 24), M.steelDark, x, 87, z)
  for (const dz of [-15, 15]) add(rbox(26, 44, 5, 2), M.steelDark, x - 8, 62, z + dz)
  const w = add(new THREE.CylinderGeometry(36, 36, 24, 48), M.rubber, x - 10, 37, z); w.rotation.x = Math.PI / 2
  const hub = add(new THREE.CylinderGeometry(15, 15, 25, 32), P({ color: 0x9aa0a7, metalness: 0.9, roughness: 0.35 }), x - 10, 37, z); hub.rotation.x = Math.PI / 2
  add(rbox(30, 6, 22, 2), P({ color: 0xc8302a, roughness: 0.5 }), x + 20, 78, z)
}
for (const z of [-240, 240]) add(rbox(540, 24, 24, 4), M.steel, 0, 210, z)
for (const x of [-290, 290]) add(rbox(24, 24, 440, 4), M.steel, x, 210, 0)
// the deck: stainless housing, recessed drip deck, seam
add(rbox(660, 70, 560, 10, 5), M.steel, 0, TOP - 35, 0)
add(rbox(632, 2, 532, 6), M.steelDark, 0, TOP + 0.2, 0)
add(rbox(660, 1.2, 1, 0.5), M.steelDark, 0, TOP - 48, 280.2)
// four bar load cells in the gap under the plate (outer end on the deck, inner end carries the plate)
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const xc = sx * 247, z = sz * 200
  add(rbox(22, 12, 20, 2), M.steelDark, sx * 282, TOP + 6, z)
  add(rbox(92, 14, 14, 1.5), M.alu, xc, TOP + 19, z)
  add(rbox(22, 8, 20, 2), M.steelDark, sx * 212, TOP + 30, z)
  add(rbox(22, 3, 12, 1, 2), M.gauge, xc, TOP + 27.2, z)
  for (const dx of [-13, 13]) { const h = add(new THREE.CylinderGeometry(4.2, 4.2, 14.6, 24), M.hole, xc + dx, TOP + 19, z); h.rotation.x = Math.PI / 2 }
  for (const [k, m] of [[0, M.wireR], [1, M.wireK], [2, M.wireG], [3, M.wireW]]) {
    const x0 = sx * 293, y0 = TOP + 19, z0 = z + (k - 1.5) * 2.6
    const c = new THREE.CatmullRomCurve3([new THREE.Vector3(x0, y0, z0), new THREE.Vector3(x0 + sx * 8, y0 - 4, z0), new THREE.Vector3(x0 + sx * 10, TOP + 6, z0 - sz * 6), new THREE.Vector3(x0 + sx * 2, TOP + 2, z0 - sz * 16)])
    add(new THREE.TubeGeometry(c, 24, 0.9, 8), m)
  }
  anchors[`cell${sx > 0 ? 'R' : 'L'}${sz > 0 ? 'F' : 'B'}`] = new THREE.Vector3(xc, TOP + 19, z + sz * 7)
}
// the weighing plate, with a rim
add(rbox(600, 12, 480, 6), M.plate, 0, PB + 6, 0)
{
  const s = rrect(new THREE.Shape(), -300, -240, 300, 240, 10); s.holes.push(rrect(new THREE.Path(), -290, -230, 290, 230, 6))
  const g = new THREE.ExtrudeGeometry(s, { depth: 4, bevelEnabled: true, bevelThickness: 1.2, bevelSize: 1.2, bevelSegments: 3, curveSegments: 12 })
  const o = add(g, M.plate, 0, PT, 0); o.rotation.x = -Math.PI / 2
}
// back panel and canopy (white powder coat), the canopy's underside dark with the sensors
M.white = P({ color: 0xf2f2ef, roughness: 0.42, clearcoat: 0.25, clearcoatRoughness: 0.4 })
add(rbox(660, CAN + 64 - TOP + 10, 24, 8, 4), M.white, 0, (TOP - 10 + CAN + 64) / 2, -268)
add(rbox(680, 64, 572, 12, 5), M.white, 0, CAN + 32, -6)
add(rbox(640, 2, 520, 10), M.graphite2, 0, CAN - 0.8, 0)
{
  const y0 = CAN - 1.6, cz = 10
  add(new THREE.CylinderGeometry(30, 30, 10, 64), P({ color: 0x3b3f45, metalness: 0.85, roughness: 0.28 }), 0, y0 - 5, cz)
  add(new THREE.CylinderGeometry(23, 23, 1.5, 64), M.polar, 0, y0 - 10.5, cz)
  add(new THREE.CylinderGeometry(11, 11, 1.6, 48), M.glass, 0, y0 - 10.8, cz)
  const ring = new THREE.RingGeometry(38, 52, 128); ring.rotateX(Math.PI / 2); add(ring, M.ring, 0, y0 - 0.3, cz)
  const rim = new THREE.TorusGeometry(53.5, 1.6, 12, 128); rim.rotateX(Math.PI / 2); add(rim, M.graphite2, 0, y0 - 0.2, cz)
  for (const sx of [-1, 1]) add(rbox(200, 3, 400, 4), M.diffuse, sx * 175, y0 - 0.5, cz)
  for (const [x, z] of [[0, cz - 66], [0, cz + 66]]) add(new THREE.CylinderGeometry(4, 4, 1.6, 24), M.nir, x, y0 - 0.6, z)
  anchors.lens = new THREE.Vector3(0, y0 - 10, cz + 20); anchors.ring = new THREE.Vector3(36, y0, cz + 30); anchors.diffuse = new THREE.Vector3(240, y0, cz + 120); anchors.nir = new THREE.Vector3(0, y0, cz + 66)
  anchors.canopy = new THREE.Vector3(-120, CAN + 10, 280)
}
// brand on the canopy's front edge
{
  const img = new Image(); img.src = 'babsim.svg'; await img.decode()
  const t = tex(1024, 112, (c, w, h) => { c.fillStyle = '#f2f2ef'; c.fillRect(0, 0, w, h); const s = h * 0.72 / 118.545; c.drawImage(img, 30, h * 0.14, 105 * s, 118.545 * s)
    c.fillStyle = '#2a2d31'; c.font = '800 58px -apple-system, "Apple SD Gothic Neo", sans-serif'; c.textBaseline = 'middle'; c.fillText('밥심 스캐너', 30 + 105 * s + 22, h / 2 + 3) })
  add(new THREE.PlaneGeometry(330, 36), P({ map: t, roughness: 0.45 }), -150, CAN + 32, 280.3)
  add(new THREE.CylinderGeometry(3.2, 3.2, 1, 20), M.led, 300, CAN + 32, 280.2).rotation.x = Math.PI / 2
}
// result screen on the back panel, facing the student
{
  const img = new Image(); img.src = 'babsim.svg'; await img.decode()
  add(rbox(300, 206, 12, 12, 4), M.graphite2, 0, 1290, -250)
  const t = tex(1120, 760, (c, w, h) => {
    c.fillStyle = '#fbfaf4'; c.fillRect(0, 0, w, h)
    const s = 70 / 118.545; c.drawImage(img, 48, 40, 105 * s, 70)
    c.fillStyle = '#5c564c'; c.font = '600 34px -apple-system, "Apple SD Gothic Neo", sans-serif'; c.textBaseline = 'alphabetic'; c.fillText('점심 · 11:52', 140, 92)
    c.fillStyle = '#221f1b'; c.font = '800 64px -apple-system, "Apple SD Gothic Neo", sans-serif'; c.fillText('남긴 양 128 g', 48, 200)
    c.fillStyle = '#d81111'; c.font = '700 34px -apple-system, "Apple SD Gothic Neo", sans-serif'; c.fillText('지난주 평균보다 −32 g', 48, 252)
    const rows = [['사과샐러리무침', 1.0, '#ef1111'], ['짬뽕국', 0.42, '#ef1111'], ['애호박감자전', 0.2, '#b9b2a4'], ['찰현미밥', 0.08, '#b9b2a4']]
    rows.forEach(([n, v, col], i) => { const y = 330 + i * 96
      c.fillStyle = '#f1efe8'; c.beginPath(); c.roundRect(48, y, w - 96, 78, 22); c.fill()
      c.fillStyle = '#221f1b'; c.font = '700 34px -apple-system, "Apple SD Gothic Neo", sans-serif'; c.fillText(n, 76, y + 50)
      c.fillStyle = '#ffffff'; c.beginPath(); c.roundRect(560, y + 30, 360, 18, 9); c.fill(); c.fillStyle = col; c.beginPath(); c.roundRect(560, y + 30, 360 * v, 18, 9); c.fill()
      c.fillStyle = '#221f1b'; c.font = '700 32px ui-rounded, -apple-system, sans-serif'; c.fillText(Math.round(v * 100) + '%', 948, y + 50) })
    c.fillStyle = '#5c564c'; c.font = '500 30px -apple-system, "Apple SD Gothic Neo", sans-serif'; c.fillText('단백질 41 / 39 g · 충분', 48, 728)
  })
  add(new THREE.PlaneGeometry(280, 190), new THREE.MeshStandardMaterial({ map: t, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 0.9, roughness: 0.2 }), 0, 1290, -243.8)
  anchors.screen = new THREE.Vector3(110, 1330, -243)
}
// controller under the deck (ESP32 for the cells + a small computer for the camera)
{
  const g = new THREE.Group(); g.position.set(-40, TOP - 70 - 48, 40); scene.add(g)
  add(rbox(300, 90, 220, 8, 4), M.graphite, 0, 0, 0, g)
  for (let i = 0; i < 7; i++) add(rbox(140, 3, 1.6, 0.8, 2), M.graphite2, -50, -30 + i * 9, 110.4, g)
  const t = tex(256, 96, (c, w, h) => { c.fillStyle = '#05070a'; c.fillRect(0, 0, w, h); c.fillStyle = '#7fe3a2'; c.font = '600 30px ui-monospace, Menlo, monospace'; c.textBaseline = 'middle'; c.fillText('● 4 cells OK', 14, h * 0.32); c.fillStyle = '#9aa3ad'; c.fillText('cam  ready', 14, h * 0.72) })
  add(new THREE.PlaneGeometry(64, 24), new THREE.MeshStandardMaterial({ map: t, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 1.4 }), 80, 16, 110.5, g)
  add(new THREE.CylinderGeometry(2.6, 2.6, 1, 20), M.led, 80, -22, 110.6, g).rotation.x = Math.PI / 2
  anchors.ctrl = new THREE.Vector3(-40 + 60, TOP - 118, 40 + 110)
}
// student-ID reader on the deck's front-right corner, tilted to the student
{
  const g = new THREE.Group(); g.position.set(250, TOP - 22, 318); g.rotation.x = THREE.MathUtils.degToRad(28); scene.add(g)
  add(rbox(130, 30, 96, 12, 5), M.graphite, 0, 0, 0, g)
  const t = tex(512, 400, (c, w, h) => { c.fillStyle = '#0b0d10'; c.fillRect(0, 0, w, h); c.strokeStyle = '#dfe3e8'; c.lineWidth = 10; c.lineCap = 'round'
    for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(w * 0.36, h * 0.46, 40 + i * 34, -0.6, 0.6); c.stroke() }
    c.fillStyle = '#dfe3e8'; c.font = '700 44px -apple-system, "Apple SD Gothic Neo", sans-serif'; c.textAlign = 'center'; c.fillText('학생증', w * 0.5, h * 0.9) })
  add(new THREE.PlaneGeometry(114, 82).rotateX(-Math.PI / 2), P({ map: t, roughness: 0.06, clearcoat: 1 }), 0, 15.3, -2, g)
  add(rbox(70, 3, 3, 1.4, 2), M.led, 0, 4, 48.4, g)
  add(rbox(40, 40, 24, 4), M.steelDark, 0, -10, -46, g)
  anchors.reader = new THREE.Vector3(250, TOP - 2, 318)
}

}
if (ONLY === 'tray') add(rbox(2400, 20, 1600, 6), P({ color: q.get('white') ? 0xffffff : 0xe6e4df, roughness: 0.62 }), 0, PT - 10, 0)
// KSA tray (white plastic, five wells) with what was left
const tray = new THREE.Group(); tray.position.set(-72, PT, 6); tray.rotation.y = THREE.MathUtils.degToRad(4); scene.add(tray)
const K = ONLY === 'tray' ? 3 : 1   // the tray-only shot shows a lot more left over
const wells = { side1: [-170, -122, -64, -42], side2: [-52, -122, 52, -42], side3: [64, -122, 170, -42], rice: [-170, -30, -8, 122], main: [4, -30, 170, 122] }
{
  add(rbox(380, 3, 280, 1.5), M.tray, 0, 1.5, 0, tray)
  const s = rrect(new THREE.Shape(), -190, -140, 190, 140, 26)
  for (const [x0, z0, x1, z1] of Object.values(wells)) s.holes.push(rrect(new THREE.Path(), x0, z0, x1, z1, 14))
  const g = new THREE.ExtrudeGeometry(s, { depth: 20, bevelEnabled: true, bevelThickness: 2.2, bevelSize: 2.2, bevelSegments: 4, curveSegments: 14 })
  const o = add(g, M.tray, 0, 2.2, 0, tray); o.rotation.x = -Math.PI / 2
}
const blob = (r, detail = 2, rough = 0.35) => { const g = new THREE.IcosahedronGeometry(r, detail); const p = g.attributes.position, v = new THREE.Vector3()
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); v.multiplyScalar(1 + (rnd() - 0.5) * rough); p.setXYZ(i, v.x, v.y, v.z) } g.computeVertexNormals(); return g }
const placeIn = (geos, g, x, y, z, rx, ry, rz, sx = 1, sy = 1, sz = 1) => { g.scale(sx, sy, sz); g.rotateX(rx); g.rotateY(ry); g.rotateZ(rz); g.translate(x, y, z); geos.push(g) }
const inWell = (w, pad = 10) => [R(w[0] + pad, w[2] - pad), R(w[1] + pad, w[3] - pad)]
{ // rice: a thin mound of grains left in a corner of the rice well
  const gs = []
  for (let i = 0; i < 520 * K * 2; i++) { const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * 46 * (K > 1 ? 1.45 : 1); const x = -118 + Math.cos(a) * r * 1.2, z = 72 + Math.sin(a) * r * 0.8
    const h = 4 + (46 * (K > 1 ? 1.45 : 1) - r) * (K > 1 ? 0.42 : 0.18); placeIn(gs, new THREE.SphereGeometry(1, 8, 6), x, 3 + rnd() * h, z, R(0, 3), R(0, 3), R(0, 3), 2.6, 1.15, 1.15) }
  add(mergeGeometries(gs), M.rice, 0, 0, 0, tray)
}
{ // kimchi in side1: a few cabbage pieces, red and pale
  const gr = [], gp = []
  for (let i = 0; i < 9 * K; i++) { const [x, z] = inWell(wells.side1, 16); placeIn(rnd() < 0.7 ? gr : gp, blob(1, 2, 0.5), x, 5 + rnd() * 3, z, R(-0.3, 0.3), R(0, 3), R(-0.3, 0.3), R(11, 17), R(2.2, 3.4), R(7, 11)) }
  add(mergeGeometries(gr), M.kimchi, 0, 0, 0, tray); if (gp.length) add(mergeGeometries(gp), M.napa, 0, 0, 0, tray)
  const s = new THREE.CircleGeometry(24, 32); s.rotateX(-Math.PI / 2); s.scale(1.4, 1, 0.8); s.translate(-112, 3.3, -84); add(s, M.sauce, 0, 0, 0, tray)
}
{ // spinach namul in side2: thin strands
  const gs = []
  for (let i = 0; i < 26 * K; i++) { const [x, z] = inWell(wells.side2, 18); const g = new THREE.CapsuleGeometry(1.4, R(14, 26), 4, 8); g.rotateZ(Math.PI / 2); placeIn(gs, g, x, 4.5 + rnd() * 3, z, 0, R(0, 3.1), R(-0.15, 0.15)) }
  add(mergeGeometries(gs), M.greens, 0, 0, 0, tray)
}
{ // side3: emptied, a smear of sauce and two pieces of pork
  const s = new THREE.CircleGeometry(20, 32); s.rotateX(-Math.PI / 2); s.scale(1.7, 1, 0.9); s.translate(120, 3.3, -78); add(s, M.sauce, 0, 0, 0, tray)
  const gs = []; for (let i = 0; i < 2 * K; i++) placeIn(gs, blob(1, 2, 0.4), 92 + (i % 3) * 26 + R(-4, 4), 6 + (i > 2 ? 3 : 0), -96 + Math.floor(i / 3) * 22 + R(-3, 3), 0, R(0, 3), 0, 14, 4, 9)
  add(mergeGeometries(gs), M.meat, 0, 0, 0, tray)
}
{ // main well: chopsticks and a spoon resting across it
  const st = new THREE.Group(); tray.add(st)

// studio environment: soft overall light, a large softbox overhead and a key box front-left (equirect, linear HDR)
function studioEnv() {
  const w = 1024, h = 512, d = new Float32Array(w * h * 4)
  const box = (u, v, cu, cv, su, sv) => Math.exp(-(((u - cu) / su) ** 8) - (((v - cv) / sv) ** 8))
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const u = i / w, v = j / h, el = (0.5 - v) * Math.PI
    let L = (q.get('white') ? 1.35 : 0.75) + 0.35 * Math.max(0, Math.sin(el))
    L += 9 * box(u, v, 0.5, 0.06, 0.5, 0.07)            // overhead softbox
    L += 7 * box(u, v, 0.66, 0.30, 0.06, 0.07)          // key, front-left
    L += 2.5 * box(u, v, 0.18, 0.34, 0.05, 0.08)        // rim, back-right
    if (el < 0) L = q.get('white') ? 0.9 : 0.45
    const k = (j * w + i) * 4; d[k] = d[k + 1] = d[k + 2] = L; d[k + 3] = 1
  }
  const t = new THREE.DataTexture(d, w, h, THREE.RGBAFormat, THREE.FloatType); t.mapping = THREE.EquirectangularReflectionMapping; t.needsUpdate = true; return t
}
